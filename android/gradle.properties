# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# Added Java 17+ compatibility flags and increased memory for better performance
# CRITICAL: All --add-opens flags are required for Java 17+ compatibility with Gradle 9.0.0
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.prefs/java.util.prefs=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=java.base/java.nio.charset=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.xml/javax.xml.namespace=ALL-UNNAMED

# CRITICAL FIX: Configure daemon to avoid port conflicts
# Using port 0 lets the OS automatically assign a free port (most reliable solution)
org.gradle.daemon.port=0

# Daemon configuration for optimal performance
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.daemon.idle.timeout=10800000

# Performance optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# CRITICAL FIX: Enable Jetifier to automatically migrate com.android.support to androidx
# This fixes the issue with react-native-video dependency (Android-ScalableVideoView)
android.enableJetifier=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# CRITICAL: In React Native 0.82+, newArchEnabled is no longer supported in gradle.properties
# New Architecture is enabled by default. To disable it (required for react-native-video 5.x),
# use the react block in app/build.gradle instead.

# CRITICAL FIX: Disable IDE init scripts to prevent missing file errors
org.gradle.ide.initScripts.enabled=false

# CRITICAL FIX: Ignore missing init scripts from IDE extensions
org.gradle.ide.initScripts.ignoreMissing=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false
