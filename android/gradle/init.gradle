// Gradle Init Script - Prevents IDE initialization errors
// This file ensures Gradle can run even if IDE init scripts are missing

// Disable any missing init script errors
gradle.beforeProject { project ->
    // Allow project to build even if IDE init scripts are missing
    project.logger.info("Gradle project initialization: ${project.name}")
}

// Configure build cache and performance
gradle.settingsEvaluated { settings ->
    settings.buildCache {
        local {
            enabled = true
        }
    }
}

